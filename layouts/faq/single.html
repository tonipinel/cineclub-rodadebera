{{ define "main" }}
<section class="page-hero">
  <h1 class="page-hero__title">{{ .Title }}</h1>
</section>
<div class="page-body">
  {{ range .Params.faq }}
    <details class="faq__item">
      <summary class="faq__question">{{ .pregunta }}</summary>
      <div class="faq__answer prose-ca">{{ .resposta | markdownify }}</div>
    </details>
  {{ end }}
</div>
{{ end }}
